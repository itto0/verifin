services:
  processing:
    build:
      context: ./services/processing
      dockerfile: Dockerfile

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-/api/ai}
        VITE_AI_API_KEY: ${VITE_AI_API_KEY:-}
        VITE_AI_MODEL: ${VITE_AI_MODEL:-antigravity/gemini-3-flash-preview}
